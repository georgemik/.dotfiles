#####################	cheat sheet 	############################################
#	commands:
#	* C-a + ?	show all commands
#	* C-a + !	break pane (move to the new window)
#	* C-a + c	create window
#	* C-a + "	split horizontally
#	* C-a + %	split vertically
#	* C-a + d	detach client
#	* C-a + x	close pane
#	* C-a + &	close window
#	* C-a + w	choose window from the list
#	* C-a + s	choose sessions/windows interactively with preview
#	* C-a + z	fulscreen current pane
#	* C-a + r	reload configuration
#	* C-a + b	select window on the right
#	* C-M-Right
#	* C-a + v	select window on the left
#	* C-M-Left
#	* C-a + e	synchronize panes (toggle)
#	* C-S-Right	move window to the right (Ctrl+Shift+Right)
#	* C-S-Left	move window to the left (Ctrl+Shift+Left)
#
#	other:
#	* tmux show -g	show current config
#	* tmux a		attach to current session
#	* tmux ls		list active sessions
#
#	download:
#	wget https://raw.githubusercontent.com/georgemik/.dotfiles/master/.tmux.conf
#
#   (i) compatible with tmux 3.2
################################################################################

# remap prefix from default 'C-b' to 'C-a' (Ctrl+<letter>)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# open new window with two panes horizontal 
bind C new-window \; split-window -v

set -g mouse on
set -g default-terminal "screen-256color"
set -g visual-bell on

# scroll history
set -g history-limit 30000

# switch between windows by Ctrl+Alt+<Arrow> or C-a+<Arrow> (with repeat)
bind-key -n C-M-Left select-window -t :-
bind-key -n C-M-Right select-window -t :+
bind -r v select-window -t :-
bind -r b select-window -t :+

# toggle synchronization of the panes
bind -r e setw synchronize-panes \; display-message "synchronize panes #{?synchronize-panes,ON,OFF}"

# move current window left/Right (Ctrl+Shift+<Arrow>)
bind-key -n C-S-Left swap-window -t -1\; select-window -t :-
bind-key -n C-S-Right swap-window -t +1\; select-window -t :+

# reload config file in tmux session
bind r source-file ~/.tmux.conf \; display-message "configuration reloaded"
bind -r T splitw -v -b -p 70\; splitw -t 0 -h
bind -r + splitw -p 50 \; splitw -t 0 -h \; splitw -t 2 -h

# bottom bar colors
BOTTOM_BAR_BG_COLOR=colour90
BOTTOM_BAR_BG_COLOR_VSCODE=colour226
BOTTOM_BAR_FONT_COLOR=colour248
# yellow background needs a dark foreground to stay readable
BOTTOM_BAR_FONT_COLOR_VSCODE=colour16

# style options are format-expanded per session, so the bar colour is chosen by
# session name: sessions called 'vscode*' get the alternate background
BAR_BG="#{?#{m:vscode*,#{session_name}},$BOTTOM_BAR_BG_COLOR_VSCODE,$BOTTOM_BAR_BG_COLOR}"
BAR_FG="#{?#{m:vscode*,#{session_name}},$BOTTOM_BAR_FONT_COLOR_VSCODE,$BOTTOM_BAR_FONT_COLOR}"
set -g status-style "fg=$BAR_FG,bg=$BAR_BG"

# window status bottom bar style
set -g window-status-current-style "fg=$BAR_BG,bg=$BAR_FG,bright,underscore"

# default is 10, which crops session names like '[vscode-k8s-wb] '
set -g status-left-length 40
set -g status-right-length 140
set -g status-right "#(grep -Po '(?<=current-context: ).*' --color=never ~/.kube/config 2>/dev/null) |"
set -ag status-right " #[fg=$BAR_FG,bg=default]%a%l:%M:%S %p %Y-%m-%d#[default]"

set-option -g -s status-interval 1

# $(grep -Po "(?<=current-context: ).*" --color=never ~/.kube/config 2>/dev/null)"

# pane border style — active border is bright and matches the session's bar colour
ACTIVE_PANE_COLOR=colour237
ACTIVE_PANE_COLOR_VSCODE=colour226
ACTIVE_PANE_BG="#{?#{m:vscode*,#{session_name}},$ACTIVE_PANE_COLOR_VSCODE,$ACTIVE_PANE_COLOR}"
set -g pane-border-style fg=colour234,bg=colour232
set -g pane-active-border-style "fg=$ACTIVE_PANE_BG,bg=colour235,bold"

# message box colors
set-option -g message-style fg=black,bg=colour154


# override ctrl keys to work with putty 
# (putty term must be set to xterm-256color (Connection > Data) 
# and allow to use 256 colors (Window > Colors > Allow terminal to use 256 colors)
set -g terminal-overrides "xterm*:kLFT@:kLFT5=\eOD:kRIT@:kRIT5=\eOC:kUP5=\eOA:kDN5=\eOB:smkx@:rmkx@"
# to F1-F12 keys working set Connection > Data > Terminal type string to 'putty-256color'
set -g terminal-overrides "putty*:kLFT@:kLFT5=\eOD:kRIT@:kRIT5=\eOC:kUP5=\eOA:kDN5=\eOB:smkx@:rmkx@"
set -g xterm-keys on

# -------------------------------------------------
# Mouse Copy Configuration (Linux with xsel)
# When dragging with the mouse, copy the selection to the system clipboard
# but do NOT clear the selection and do NOT exit copy mode (scroll position stays).
# - copy-pipe-no-clear: Sends text to xsel without resetting the scroll/selection.
# - xsel -i --clipboard: Reads from stdin (-i) into the clipboard buffer.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "xsel"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "xsel"

# Claude Code notifications (set by ~/.claude/hooks/tmux-notify.sh)
# window marker: ✓ = finished, ⏳ = waiting for input; cleared when the window is visited
set -g window-status-format "#I:#W#{?window_flags,#{window_flags}, }#{?#{==:#{@claude},done},#[fg=colour46]✓#[default] ,}#{?#{==:#{@claude},waiting},#[fg=colour220]⏳#[default] ,}"
set-hook -g session-window-changed "set -wu @claude"
# C-a + a  open (or jump to) the claude-status dashboard window
bind a new-window -S -n claude-status "~/.claude/hooks/claude-tmux-dashboard.sh"
